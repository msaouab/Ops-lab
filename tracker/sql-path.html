        <div class="card-head"><h2>Practice</h2><span>${solvedIn(t)} / ${t.problems.length} solved</span></div>
        <ul class="plist">${t.problems.map(p => `<li><button type="button" data-go="problem" data-arg="${p.id}">
          <span class="check${store.solved[p.id] ? ' on' : ''}" aria-label="${store.solved[p.id] ? 'Solved' : 'Not solved'}"></span>
          <span class="t">${esc(p.title)}</span><span class="pill ${p.diff}">${p.diff}</span></button></li>`).join('')}</ul>
      </div>
      ${nextT ? `<button class="btn next-topic" type="button" data-go="topic" data-arg="${nextT.id}">Next topic: ${esc(nextT.title)} →</button>` : ''}
    </aside>
  </div>`;
  bindLesson(t, code => { playCode = code; go('play'); });
}

/* The lesson is shared by the topic page and the Lesson tab of each problem. */
const readBtn = (t, i) => { const on = !!store.read[t.id + ':' + i]; return `<button type="button" class="readbtn${on ? ' on' : ''}" data-read="${i}" aria-pressed="${on}"><span class="check${on ? ' on' : ''}"></span>${on ? 'Read' : 'Mark as read'}</button>`; };
function lessonHTML(t, tryLabel) {
  return `<article class="lesson">
      ${t.lesson.map((s, i) => `<section class="sec" id="sec-${i}">
        <div class="sec-head"><h3><span class="n">${t.n}.${i + 1}</span>${s.h}</h3>${readBtn(t, i)}</div>
        <p>${s.p}</p>
        ${s.list ? `<ul>${s.list.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        ${s.code ? `<div class="example"><pre><code>${hl(s.code)}</code></pre>
          <div class="example-bar"><button class="btn small primary" type="button" data-ex="${i}">Run</button><button class="btn small ghost" type="button" data-try="${i}">${tryLabel}</button></div>
          <div class="out" id="ex-out-${i}" hidden></div></div>` : ''}
        ${s.pg ? `<div class="pg"><b>PostgreSQL</b>${s.pg}</div>` : ''}
      </section>`).join('')}
      <div class="lesson-end"><span class="lesson-prog">${readIn(t)} / ${t.lesson.length} sections read</span><button type="button" class="btn small" data-read-all>Mark whole lesson as read</button></div>
    </article>`;
}
function bindLesson(t, onTry) {
  $('#app').querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.ex, db = freshDb(), r = runSql(db, t.lesson[i].code); db.close();
    const out = $('#ex-out-' + i); out.hidden = false; out.innerHTML = `<div class="results">${runResultHTML(r)}</div>`;
  }));
  $('#app').querySelectorAll('[data-try]').forEach(b => b.addEventListener('click', () => onTry(t.lesson[+b.dataset.try].code)));
  const refresh = () => {
    save();
    $('#app').querySelectorAll('[data-read]').forEach(b => { b.outerHTML = readBtn(t, +b.dataset.read); });
    $('#app').querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', toggle));
    const r = readIn(t), n = t.lesson.length;
    $('#app').querySelectorAll('.lesson-prog').forEach(el => { el.textContent = `${r} / ${n} sections read`; });
    $('#app').querySelectorAll('.lesson-fill').forEach(el => { el.style.width = (100 * r / n) + '%'; });
    const tab = $('#tab-lesson-state'); if (tab) tab.textContent = r === n ? 'Read' : `${r}/${n}`;
  };
  function toggle(e) { const k = t.id + ':' + e.currentTarget.dataset.read; if (store.read[k]) delete store.read[k]; else store.read[k] = Date.now(); refresh(); }
  $('#app').querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', toggle));
  $('#app').querySelectorAll('[data-read-all]').forEach(b => b.addEventListener('click', () => { t.lesson.forEach((x, i) => { store.read[t.id + ':' + i] = store.read[t.id + ':' + i] || Date.now(); }); refresh(); }));
}

let problemTab = 'problem';
function renderProblem() {
  const p = PROB[state.problem], t = TOPIC[p.topic], i = PROBLEMS.indexOf(p), prev = PROBLEMS[i - 1], next = PROBLEMS[i + 1];
  const ref = reference(p), want = lastSet(ref);
  const tables = SCHEMA.filter(s => p.tables.includes(s.name));
  const starter = store.code[p.id] != null ? store.code[p.id] : (p.type === 'mutate' ? '-- write your statements here\n' : '-- write your query here\n');
  $('#app').innerHTML = `
  <div class="crumbs"><button type="button" data-go="home">Roadmap</button><span>/</span><button type="button" data-go="topic" data-arg="${t.id}">${esc(t.title)}</button><span>/</span><span>${esc(p.title)}</span></div>
  <div class="ws-head">
    <span class="check${store.solved[p.id] ? ' on' : ''}" id="ws-check"></span>
    <h1>${esc(p.title)}</h1><span class="pill ${p.diff}">${p.diff}</span>
    <span class="spacer"></span>
    ${prev ? `<button class="btn small" type="button" data-go="problem" data-arg="${prev.id}" aria-label="Previous problem">← Prev</button>` : ''}
    ${next ? `<button class="btn small" type="button" data-go="problem" data-arg="${next.id}" aria-label="Next problem">Next →</button>` : ''}
  </div>
  <div class="ws">
    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-problem" aria-selected="${problemTab === 'problem'}">Problem</button>
        <button type="button" role="tab" id="tab-lesson" aria-selected="${problemTab === 'lesson'}">Lesson · ${esc(t.title)} <span class="tabstate" id="tab-lesson-state">${lessonDone(t) ? 'Read' : readIn(t) + '/' + t.lesson.length}</span></button>
      </div>
      <div id="pane-lesson" class="lesson-pane"${problemTab === 'lesson' ? '' : ' hidden'}>
        <p class="muted" style="font-size:14px">The lesson for this topic. Run any example, or copy it into the editor to adapt it.</p>
        ${lessonHTML(t, 'Copy to editor')}
      </div>
      <div id="pane-problem" class="pane"${problemTab === 'problem' ? '' : ' hidden'}>
      <div class="stmt"><p>${p.prompt}</p>
        <p class="muted" style="font-size:14px">${p.type === 'mutate' ? 'Your statements run on a fresh copy of the database, then the check query below is compared with the expected result.' : p.ordered ? 'Rows must come back in the order shown.' : 'Any row order is accepted. Column names are not checked unless the problem says so.'}</p>
      </div>
      ${tables.length ? `<div class="tables"><div class="subh">Tables<small>key column highlighted</small></div>${tables.map(s => `<div class="tbl"><b>${esc(s.name)}</b><div class="cols">${colsHTML(s)}</div></div>`).join('')}</div>` : ''}
      ${p.check ? `<div class="tables"><div class="subh">Check query</div><details open><summary>Runs after your SQL</summary><div><pre><code>${hl(p.check)}</code></pre></div></details></div>` : ''}
      <div class="tables"><div class="subh">Expected output<small>${want ? want.values.length + ' row' + (want.values.length === 1 ? '' : 's') : ''}</small></div>${tableHTML(want, { max: 50 })}</div>
      <details><summary>Hint</summary><div><p>${esc(p.hint)}</p></div></details>
      <details id="sol"><summary>Solution</summary><div><pre><code>${hl(p.solution)}</code></pre><div><button class="btn small" type="button" id="load-sol">Load into editor</button></div></div></details>
      </div>
    </section>
    <section class="ide">
      <div class="ide-box">
        <div class="ide-bar"><span class="label">${p.type === 'mutate' ? 'statements' : 'query'}.sql · SQLite</span><button class="btn small ghost" type="button" id="reset-code">Reset</button></div>
        ${editorHTML('ed', starter)}
        <div class="ide-foot">
          <span class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> run · add <kbd>Shift</kbd> to submit</span>
          <button class="btn" type="button" id="run">Run</button>
          <button class="btn primary" type="button" id="submit">Submit</button>
        </div>
      </div>
      <div class="ide-box" id="out-box"><div class="results" id="out"><div class="verdict info"><b>Output</b><span>Run your SQL to see its result here, or submit it to be graded.</span></div></div></div>
    </section>
  </div>`;
  const ta = bindEditor('ed', {
    onRun: () => doRun(), onSubmit: () => doSubmit(),
    onChange: v => { store.code[p.id] = v; save(); }
  });
  function doRun() {
    const db = freshDb(); let r = runSql(db, ta.value);
    let extra = '';
    if (r.ok && p.type === 'mutate') { const c = runSql(db, p.check); extra = `<div class="subh">Check query on your database</div>` + runResultHTML(c); }
    db.close();
    $('#out').innerHTML = `<div class="subh">Your output</div>` + runResultHTML(r) + extra;
  }
  function doSubmit() {
    const j = judge(p, ta.value);
    if (j.pass && !store.solved[p.id]) { store.solved[p.id] = Date.now(); save(); renderScore(); $('#ws-check').classList.add('on'); }
    const nextBtn = j.pass && next ? `<div><button class="btn small primary" type="button" data-go="problem" data-arg="${next.id}">Next problem: ${esc(next.title)} →</button></div>` : '';
    $('#out').innerHTML = `<div class="verdict ${j.pass ? 'ok' : 'bad'}"><b>${j.title}</b><span>${esc(j.msg)}</span></div>${nextBtn}` +
      (j.error ? '' : `<div class="compare"><div><div class="subh">Your output</div>${tableHTML(j.mine, { max: 50, bad: j.badRow })}</div><div><div class="subh">Expected</div>${tableHTML(j.want, { max: 50 })}</div></div>`);
  }
  $('#run').addEventListener('click', doRun);
  $('#submit').addEventListener('click', doSubmit);
  $('#reset-code').addEventListener('click', () => { ta.value = p.type === 'mutate' ? '-- write your statements here\n' : '-- write your query here\n'; ta.dispatchEvent(new Event('input')); ta.focus(); });
  $('#load-sol').addEventListener('click', () => { ta.value = p.solution; ta.dispatchEvent(new Event('input')); ta.focus(); });
  const showTab = name => {
    problemTab = name;
    $('#tab-problem').setAttribute('aria-selected', name === 'problem');
    $('#tab-lesson').setAttribute('aria-selected', name === 'lesson');
    $('#pane-problem').hidden = name !== 'problem';
    $('#pane-lesson').hidden = name !== 'lesson';
  };
  $('#tab-problem').addEventListener('click', () => showTab('problem'));
  $('#tab-lesson').addEventListener('click', () => showTab('lesson'));
  bindLesson(t, code => { ta.value = code; ta.dispatchEvent(new Event('input')); ta.focus(); ta.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
}

let playCode = "-- Try anything. Changes persist here until you reset the database.\nSELECT o.name, p.name AS customer, o.state\nFROM sale_order o\nJOIN res_partner p ON p.id = o.partner_id\nORDER BY o.date_order;";
function renderPlay() {
  if (!playDb) playDb = freshDb();
  const sch = schemaInfo(playDb);
  $('#app').innerHTML = `
  <header class="topic-head"><div class="eyebrow">Free practice</div><h1>Playground</h1><p>A scratch copy of the course database. Run anything, including INSERT, DROP or CREATE. Click a table to preview it.</p></header>
  <div class="play">
    <aside class="schema">
      <div class="subh">Schema<button class="btn small ghost" type="button" id="reset-db">Reset database</button></div>
      ${sch.map(s => `<button type="button" class="tbl" data-table="${esc(s.name)}"><b>${esc(s.name)}</b><div class="cols">${colsHTML(s)}</div></button>`).join('')}
    </aside>
    <section class="ide">
      <div class="ide-box">
        <div class="ide-bar"><span class="label">playground.sql · SQLite</span></div>
        ${editorHTML('play-ed', playCode)}
        <div class="ide-foot"><span class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> to run</span><button class="btn primary" type="button" id="play-run">Run</button></div>
      </div>
      <div class="ide-box"><div class="results" id="play-out"><div class="verdict info"><b>Output</b><span>Results appear here.</span></div></div></div>
    </section>
  </div>`;
  const ta = bindEditor('play-ed', { onRun: run, onChange: v => { playCode = v; } });
  function run() {
    const r = runSql(playDb, ta.value);
    $('#play-out').innerHTML = runResultHTML(r);
    if (r.ok && /\b(CREATE|DROP|ALTER)\b/i.test(ta.value)) { const keep = $('#play-out').innerHTML; renderPlay(); $('#play-out').innerHTML = keep; }
  }
  $('#play-run').addEventListener('click', run);
  $('#reset-db').addEventListener('click', () => { playDb.close(); playDb = freshDb(); renderPlay(); $('#play-out').innerHTML = '<div class="verdict info"><b>Database reset</b><span>Every table is back to its original rows.</span></div>'; });
  $('#app').querySelectorAll('[data-table]').forEach(b => b.addEventListener('click', () => {
    ta.value = `SELECT * FROM ${b.dataset.table} LIMIT 20;`; ta.dispatchEvent(new Event('input')); run();
  }));
}

/* ---------- boot ---------- */
renderWho(false);
renderScore();
if (typeof initSqlJs !== 'function') { engineError = 'script blocked'; render(); }
else initSqlJs().then(S => {
  SQL = S;
  const db = new SQL.Database(); db.run(SEED); seedBytes = db.export(); SCHEMA = schemaInfo(db); db.close();
  const [v, a] = fromHash(); state = { view: v, topic: v === 'topic' ? a : null, problem: v === 'problem' ? a : null };
  render();
}).catch(e => { engineError = String(e.message || e); render(); });
</script>
