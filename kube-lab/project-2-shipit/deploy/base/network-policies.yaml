# Who may talk to whom. A pod selected by any policy rejects all ingress
# that no policy allows.
# Test: kubectl -n shipit-dev run probe --rm -it --image=busybox -- nc -zv -w2 redis 6379
#   (blocked: the probe pod isn't the api or worker)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-app
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shipit-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker, shipit-migrate] }
      ports:
        - port: 5432
    # instances replicate to each other
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: shipit-db
    # the operator checks instance status on port 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-gateway-and-prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [envoy-gateway-system, monitoring]
      ports:
        - port: 8000
