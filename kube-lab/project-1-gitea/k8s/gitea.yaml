# Gitea: a self-hosted Git service (repos, issues, pull requests).
#
# Why replicas: 1 and strategy: Recreate?
#  - The data PVC (repositories, sessions, search index) is ReadWriteOnce:
#    only one node can mount it.
#  - RollingUpdate would start the new pod before stopping the old one, and
#    the new pod could hang waiting for the volume.
# Scaling Gitea horizontally needs ReadWriteMany storage for repos, sessions
# and queues in Redis, and an external search index — a classic interview topic.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: gitea
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: gitea
    spec:
      securityContext:
        runAsNonRoot: true # works because the rootless image declares USER 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Express "start after the init Job has run" — Kubernetes has no
        # depends_on like Compose, so init containers fill that gap.
        - name: wait-for-db-init
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until psql -h postgres -d gitea -tAc 'select 1 from "user" where is_admin limit 1' 2>/dev/null | grep -q 1; do
                echo "waiting for gitea-init job to finish"; sleep 5
              done
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: gitea, key: db-username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: gitea, key: db-password }
          securityContext:
            runAsUser: 70
      containers:
        - name: gitea
          image: gitea/gitea:28.1.0-rootless
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: gitea-config
          env:
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef: { name: gitea, key: db-username }
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef: { name: gitea, key: db-password }
            # Must stay stable: Gitea encrypts stored secrets with it.
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: gitea, key: secret-key }
          # /api/healthz checks the database too. That's right for readiness
          # (stop sending traffic) but wrong for liveness: a DB outage would
          # make Kubernetes restart a perfectly healthy Gitea. So liveness only
          # checks that the process accepts connections.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config # app.ini is regenerated from env on every start
              mountPath: /etc/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: gitea
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Gateway API route: http://gitea.localhost:8080 -> Service gitea:80
# The shared Gateway "web" lives in namespace "gateway" (platform/gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: web
      namespace: gateway
  hostnames:
    - gitea.localhost
  rules:
    - backendRefs:
        - name: gitea
          port: 80
