# PostgreSQL written by hand as a StatefulSet so you learn the moving parts:
# stable pod name (postgres-0), headless Service for stable DNS, and a
# volumeClaimTemplate that gives each replica its own PVC.
# (Stretch: swap this for a CloudNativePG operator Cluster, like Project 2.)
#
# Needs Secret "gitea" (keys: db-username, db-password, ...) — see README step 1.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gitea
spec:
  clusterIP: None # headless: DNS returns pod IPs -> postgres-0.postgres.gitea.svc
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gitea
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: gitea
    spec:
      securityContext:
        fsGroup: 70 # "postgres" group in the alpine image
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: gitea, key: db-username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitea, key: db-password }
            - name: POSTGRES_DB # Gitea expects its database to exist already
              value: gitea
            - name: PGDATA # subdir: the volume root contains lost+found on some storage
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d gitea"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d gitea"]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
