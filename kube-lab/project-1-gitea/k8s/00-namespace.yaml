apiVersion: v1
kind: Namespace
metadata:
  name: gitea
  labels:
    app.kubernetes.io/part-of: gitea
---
# Caps the total the namespace can consume. Try: raise gitea's memory limit
# above what's left here and watch the ReplicaSet fail to create the pod
# (kubectl describe rs -n gitea).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitea-quota
  namespace: gitea
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.memory: 5Gi
    persistentvolumeclaims: "5"
    pods: "15"
---
# Defaults for any container that forgets to set requests/limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: gitea-defaults
  namespace: gitea
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
