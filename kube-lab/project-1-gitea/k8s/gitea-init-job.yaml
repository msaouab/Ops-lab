# One-off Job that creates Gitea's tables and the admin user.
# Idempotent: if the admin already exists it exits 0 without touching anything.
#
# Under Argo CD it runs as a Sync hook (re-created on every sync); with plain
# kubectl the annotations are ignored and it's an ordinary Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-init
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-init
    app.kubernetes.io/part-of: gitea
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-init
        app.kubernetes.io/part-of: gitea
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U \"$PGUSER\" -d gitea; do echo waiting for postgres; sleep 2; done"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: gitea, key: db-username }
          securityContext:
            runAsUser: 70
      containers:
        - name: init
          image: gitea/gitea:28.1.0-rootless
          # The image entrypoint writes /etc/gitea/app.ini from the env, then runs this.
          args:
            - sh
            - -c
            - |
              set -e
              gitea -c /etc/gitea/app.ini migrate
              if gitea -c /etc/gitea/app.ini admin user list --admin | grep -qw gitadmin; then
                echo "admin user already exists — nothing to do"
                exit 0
              fi
              gitea -c /etc/gitea/app.ini admin user create --admin \
                --username gitadmin --email admin@gitea.localhost \
                --password "$ADMIN_PASSWORD" --must-change-password=false
          envFrom:
            - configMapRef:
                name: gitea-config
          env:
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef: { name: gitea, key: db-username }
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef: { name: gitea, key: db-password }
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: gitea, key: secret-key }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitea, key: admin-password }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
