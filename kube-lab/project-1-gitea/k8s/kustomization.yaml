# kubectl apply -k project-1-gitea/k8s
#
# The Secret is deliberately NOT listed: never commit plain Secrets.
#  - Level 1: create it with kubectl (README step 1)
#  - Level 4: seal it with kubeseal and add gitea.sealedsecret.yaml here
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - postgres.yaml
  - gitea-config.yaml
  - gitea.yaml
  - gitea-init-job.yaml
  - ops.yaml
  # - gitea.sealedsecret.yaml
