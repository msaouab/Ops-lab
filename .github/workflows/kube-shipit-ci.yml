# CI + continuous deployment to dev, the GitOps way:
#   test -> build multi-arch images -> push to GHCR -> commit the new tag
#   to overlays/dev -> Argo CD notices the Git change and syncs.
# This workflow never talks to the cluster: no kubeconfig in CI.
name: ShipIt CI/CD

on:
  push:
    branches: [main]
    paths:
      - kube-lab/project-2-shipit/app/**
      - .github/workflows/kube-shipit-ci.yml
  pull_request:
    paths:
      - kube-lab/project-2-shipit/app/**
      - .github/workflows/kube-shipit-ci.yml

permissions:
  contents: read

concurrency:
  group: shipit-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kube-lab/project-2-shipit/app/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kube-lab/project-2-shipit/app/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Worker compiles
        run: python -m py_compile ../worker/worker.py

  build:
    name: Build ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v5
      - name: Compute image name and tag
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR names must be lowercase
          echo "name=ghcr.io/${owner}/shipit-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # QEMU + buildx: build linux/arm64 too, so images run on Apple Silicon k3d nodes.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: kube-lab/project-2-shipit/app/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: APP_VERSION=${{ steps.img.outputs.tag }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-dev:
    name: Deploy to dev (Git commit)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-write # never two workflows editing manifests at once
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Bump image tags in overlays/dev
        run: |
          tag="sha-${GITHUB_SHA::7}"
          file=kube-lab/project-2-shipit/deploy/overlays/dev/kustomization.yaml
          yq -i "(.images[].newTag) = \"$tag\"" "$file"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(shipit-dev): $tag"
          # Pushes made with GITHUB_TOKEN don't trigger new workflow runs: no loop.
          git pull --rebase origin main
          git push origin HEAD:main
